<style>
/* Layout: one working column. Header (title, service picker, status chip), tabs limited to what the user may open. */
:root{
  color-scheme:light;
  --bg:#f3f5f6;--card:#ffffff;--fg:#17222b;--mut:#5d6b76;--line:#d5dce1;--head:#e9eef1;
  --accent:#1c5b63;--on-accent:#ffffff;
  --ok-bg:#cfeadb;--ok-fg:#0d5230;--no-bg:#f6d3d6;--no-fg:#8a1b2b;--ex-bg:#f7e5b4;--ex-fg:#6d5100;--tel-bg:#d6e6f7;--tel-fg:#164a7a;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;--font-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10171c;--card:#182229;--fg:#e6edf1;--mut:#9aabb6;--line:#2c3a44;--head:#1f2c34;
  --accent:#6fbcc4;--on-accent:#0a1418;
  --ok-bg:#1d4a33;--ok-fg:#b9efd2;--no-bg:#56252d;--no-fg:#ffc9d0;--ex-bg:#554415;--ex-fg:#ffe7a3;--tel-bg:#1e3a55;--tel-fg:#bcdcf7}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.narrow{max-width:520px}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hd h1{font:600 24px/1.2 var(--font-display);margin:0;color:var(--accent)}
.hd select{flex:1;min-width:140px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:42px}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;accent-color:var(--accent)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on,button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.dng{color:var(--no-fg);border-color:var(--no-fg)}
button:disabled{opacity:.5;cursor:not-allowed}
.chip{min-height:34px;padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:default}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.chip.warn{background:var(--ex-bg);color:var(--ex-fg);border-color:transparent}.chip.err{background:var(--no-bg);color:var(--no-fg);border-color:transparent}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--head);font-size:13px;font-weight:600}
th[data-a]{cursor:pointer}
td.nm,th.nm{text-align:right;position:sticky;right:0;background:var(--card);min-width:110px;font-weight:600}
th.nm{background:var(--head)}
td.nm[data-a]{cursor:pointer}
td.c{padding:2px}
td.c button{width:100%;min-width:56px;min-height:42px;padding:6px 2px;font-weight:700;border-radius:6px;border-color:transparent;background:transparent;font-size:13px}
td.c button.ok{background:var(--ok-bg);color:var(--ok-fg)}
td.c button.no{background:var(--no-bg);color:var(--no-fg)}
td.c button.ex{background:var(--ex-bg);color:var(--ex-fg)}
td.c button.tel{background:var(--tel-bg);color:var(--tel-fg)}
td.r-g{background:var(--ok-bg);color:var(--ok-fg)}td.r-m{background:var(--ex-bg);color:var(--ex-fg)}td.r-b{background:var(--no-bg);color:var(--no-fg)}
tfoot td{background:var(--head);font-weight:700}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
textarea{width:100%;min-height:90px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:4px 0 0;color:var(--mut);font-weight:600}
.msg{background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:8px;text-align:center}
.warn{background:var(--ex-bg);color:var(--ex-fg);padding:8px 12px;border-radius:8px}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px}
.ucard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--head);color:var(--mut)}
code.ltr{direction:ltr;unicode-bidi:isolate;display:block;padding:8px 10px;background:var(--head);border-radius:8px;overflow-wrap:anywhere;font-size:13px;text-align:left}
.big{font-size:17px;min-height:52px}
td.c button.lk{cursor:not-allowed;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.spacer{height:270px}
.sheet textarea{min-height:68px}
.notetxt{white-space:pre-wrap;overflow-wrap:anywhere}
.exrow{padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
td.c button.nt{min-width:44px;font-size:16px}td.c button.nt.has{background:var(--ex-bg)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:10px;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet .opts{display:flex;gap:8px}
.sheet .opts button{flex:1;min-height:54px;font-size:17px;font-weight:700;border-color:transparent}
.sheet button.ok{background:var(--ok-bg);color:var(--ok-fg)}.sheet button.no{background:var(--no-bg);color:var(--no-fg)}.sheet button.ex{background:var(--ex-bg);color:var(--ex-fg)}.sheet button.tel{background:var(--tel-bg);color:var(--tel-fg)}
.sheet button.pri{background:var(--accent);color:var(--on-accent)}
[hidden]{display:none!important}
.seg{display:flex;gap:6px}.seg button{flex:1}
.urow{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:right;min-height:58px;padding:8px 12px}
.urow .em{direction:ltr;unicode-bidi:isolate;font-size:13px;color:var(--mut)}
details{border:1px solid var(--line);border-radius:8px;padding:2px 10px}
details>summary{cursor:pointer;min-height:42px;display:flex;align-items:center;gap:8px;list-style-position:inside}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
<script src="firebase-config.js"></script>
<script src="exceljs.min.js"></script>
<script src="firebase-bundle.js"></script>
<script>
"use strict";
/* ============================ constants ============================ */
/* حالات كل بند: 0 فارغ، 1، 2، 3. w = وزن الحالة في النسبة (null = عذر لا يُحسب) */
const ITEMS=[
  {n:"حضور القداس",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"إفتقاد",sym:["","تليفون","زيارة","X"],w:[0,.5,1,0]},
  {n:"تحضير",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"حضور الخدمة",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"حضور إجتماع الخدام",sym:["","✔","✘","عذر"],w:[0,1,0,null]}
];
const NI=ITEMS.length;
const stCls=(i,s)=>!s?"":i===1?["","tel","ok","no"][s]:["","ok","no","ex"][s];
const SCREENS=[["rec","المتابعة"],["rep","التقارير"],["srv","الخدمات والخدام"]];
const $app=document.getElementById("app");
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
/* المتابعة تُثبَّت على يوم الجمعة: أقرب جمعة في اليوم نفسه أو قبله */
const fridayOnOrBefore=s=>{const dow=new Date(s+"T12:00:00").getDay();return addDays(s,-((dow-5+7)%7))};
const today=iso(new Date());
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

const CFG=window.FIREBASE_CONFIG||{};
const ADMIN=String(window.APP_ADMIN_EMAIL||"").trim().toLowerCase();
const placeholder=v=>!v||/PASTE/i.test(String(v));
const configured=!placeholder(CFG.apiKey)&&!placeholder(CFG.projectId)&&!placeholder(CFG.appId)&&!placeholder(ADMIN)&&!!window.FB;

/* ============================ state ============================ */
/* الهرم: خدمة (svc) ← فصل (cls) ← خادم (srv). سجلات المتابعة (weeks) تخص الفصل. */
const S={user:null,authReady:false,me:undefined,svc:{},cls:{},srv:{},weeks:{},users:{},err:"",pend:{},online:navigator.onLine};
const ui={tab:"",sid:null,cid:null,date:fridayOnOrBefore(today),per:"month",month:today.slice(0,7),year:today.slice(0,4),scope:"one",del:null,msg:"",busy:false,imp:null,impText:"",uedit:null,usub:"list",ef:null,efFor:null,q:"",sq:"",pick:null,bulk:null,note:null,srvSub:"struct",openS:{}};
try{ui.sid=localStorage.getItem("servants_fb_sid");ui.cid=localStorage.getItem("servants_fb_cid")}catch(e){}
const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const subs={};
let deferredInstall=null,msgTimer=0,paintT=0,lastTab="";

const isOwner=()=>!!S.user&&!!ADMIN&&S.user.email===ADMIN;
const isAdmin=()=>!!S.user&&(isOwner()||!!(S.me&&S.me.active!==false&&S.me.role==="admin"));
const isActive=()=>isOwner()||!!(S.me&&S.me.active!==false);
const can=sc=>isAdmin()||!!(isActive()&&S.me&&S.me.screens&&S.me.screens[sc]);
const canEditRec=()=>isAdmin()||!!(isActive()&&S.me&&S.me.editor===true);
const mFull=()=>(S.me&&S.me.full)||[];
const mCls=()=>(S.me&&S.me.classes)||[];
const mSvcs=()=>(S.me&&S.me.services)||[];
const ckey=(sid,cid)=>sid+"_"+cid;
const clsAllowed=c=>isAdmin()||mFull().includes(c.sid)||mCls().includes(ckey(c.sid,c.id));
const svcList=()=>{const ids=isAdmin()?Object.keys(S.svc):mSvcs().filter(id=>S.svc[id]);return ids.map(id=>S.svc[id]).sort((a,b)=>(a.order||0)-(b.order||0))};
const cur=()=>{const l=svcList();return l.find(x=>x.id===ui.sid)||l[0]||null};
const classesOf=sid=>Object.values(S.cls).filter(c=>c.sid===sid&&clsAllowed(c)).sort((a,b)=>(a.order||0)-(b.order||0));
const curCls=()=>{const v=cur();if(!v)return null;const l=classesOf(v.id);return l.find(c=>c.id===ui.cid)||l[0]||null};
const servants=cid=>Object.values(S.srv).filter(x=>x.cid===cid).sort((a,b)=>(a.order||0)-(b.order||0));
const tabsAllowed=()=>{const t=[];if(can("rec"))t.push(["rec","المتابعة"]);if(can("rep"))t.push(["rep","التقارير"]);if(can("srv"))t.push(["srv","الخدمات والخدام"]);if(isAdmin())t.push(["usr","المستخدمون"]);t.push(["acc","حسابي"]);return t};
const cellKey=(vid,i)=>vid+"_"+i;
const getWeek=(cid,date)=>S.weeks[cid+"|"+date]||{cells:{},why:{},notes:{}};
const isExcuse=(i,s)=>ITEMS[i].sym[s]==="عذر";
const getState=(cid,date,vid,i)=>{const w=S.weeks[cid+"|"+date];return(w&&w.cells&&w.cells[cellKey(vid,i)])||0};
const cpath=(sid,cid)=>"services/"+sid+"/classes/"+cid;
const wpath=(sid,cid,d)=>cpath(sid,cid)+"/weeks/"+d;
const spath=(sid,cid,vid)=>cpath(sid,cid)+"/servants/"+vid;

/* ============================ statistics ============================ */
function stats(cid,test){
  const sv=servants(cid),by={};
  sv.forEach(s=>by[s.id]={sv:s,cnt:ITEMS.map(()=>[0,0,0,0]),score:0,rec:0,ex:0,p:null});
  for(const k in S.weeks){
    const w=S.weeks[k];if(w.cid!==cid||!test(w.date))continue;
    for(const ck in (w.cells||{})){
      const u=ck.lastIndexOf("_"),vid=ck.slice(0,u),i=+ck.slice(u+1),st=+w.cells[ck],o=by[vid];
      if(!o||!ITEMS[i]||!st)continue;
      o.cnt[i][st]++;
      const wt=ITEMS[i].w[st];
      if(wt===null)o.ex++;else{o.rec++;o.score+=wt}
    }
  }
  return sv.map(s=>{const o=by[s.id];o.p=o.rec>0?o.score/o.rec:null;return o});
}
const rate=p=>p==null?"":p>=.9?"ممتاز":p>=.75?"جيد جداً":p>=.5?"جيد":"يحتاج إلى متابعة";
const rcls=p=>p==null?"":p>=.75?"g":p>=.5?"m":"b";
const pc=p=>p==null?"":Math.round(p*100)+"%";
const avg=a=>{const x=a.filter(v=>v!=null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const testFn=()=>ui.per==="month"?d=>d.startsWith(ui.month):ui.per==="year"?d=>d.startsWith(ui.year):()=>true;
const periodLabel=()=>ui.per==="month"?ui.month:ui.per==="year"?ui.year:"الكل";
function rowOf(o){const c=o.cnt;return[o.sv.name,c[0][1],c[1][1],c[1][2],c[2][1],c[3][1],c[4][1],o.rec,o.ex,o.p,rate(o.p)]}
const REPORT_HEAD=["الخادم","حضور القداس","إفتقاد (تليفون)","إفتقاد (زيارة)","تحضير","حضور الخدمة","حضور إجتماع الخدام","البنود المسجّلة","أيام العذر","النسبة","التقدير"];
function totalRow(st){
  const sum=f=>st.reduce((s,o)=>s+f(o),0),p=avg(st.map(o=>o.p));
  return["المتوسط",sum(o=>o.cnt[0][1]),sum(o=>o.cnt[1][1]),sum(o=>o.cnt[1][2]),sum(o=>o.cnt[2][1]),sum(o=>o.cnt[3][1]),sum(o=>o.cnt[4][1]),sum(o=>o.rec),sum(o=>o.ex),p,rate(p)];
}

/* ============================ data subscriptions ============================ */
const dbErr=e=>{S.err=(e&&e.code==="permission-denied")?"رفضت قاعدة البيانات الطلب. تأكد من نشر قواعد Firestore ومن تسجيل بريدك لدى المدير.":"تعذر الاتصال بقاعدة البيانات"+(e&&e.code?" ("+e.code+")":"");paint()};
const setPend=(k,m)=>{S.pend[k]=!!(m&&m.pending)};
function unsubAll(){for(const k in subs){try{subs[k]()}catch(e){}delete subs[k]}}
function dropClass(cid){
  delete S.cls[cid];
  for(const k in S.srv)if(S.srv[k].cid===cid)delete S.srv[k];
  for(const k in S.weeks)if(S.weeks[k].cid===cid)delete S.weeks[k];
}
function dropService(id){
  delete S.svc[id];
  Object.values(S.cls).filter(c=>c.sid===id).forEach(c=>dropClass(c.id));
}
function reconcile(){
  if(!S.user||!isActive())return;
  const admin=isAdmin(),want=new Set(["me"]);
  const add=(k,fn)=>{want.add(k);if(!subs[k])subs[k]=fn()};
  if(!admin)Object.values(S.cls).forEach(c=>{if(!clsAllowed(c))dropClass(c.id)});
  if(admin){
    add("svcs",()=>FB.watchCol("services",(list,m)=>{
      setPend("svcs",m);const seen={};
      list.forEach(d=>{seen[d.id]=1;S.svc[d.id]={id:d.id,name:d.name||"",order:d.order||0}});
      Object.keys(S.svc).forEach(id=>{if(!seen[id])dropService(id)});
      S.err="";reconcile();paint();
    },dbErr));
    add("users",()=>FB.watchCol("users",(list,m)=>{setPend("users",m);S.users={};list.forEach(d=>S.users[d.id]=d);paint()},dbErr));
  }
  for(const sid of (admin?Object.keys(S.svc):mSvcs())){
    if(!admin)add("svc:"+sid,()=>FB.watchDoc("services/"+sid,(d,m)=>{setPend("svc:"+sid,m);if(d)S.svc[sid]={id:sid,name:d.name||"",order:d.order||0};else dropService(sid);S.err="";paint()},dbErr));
    const upsert=(cid,d)=>{S.cls[cid]={id:cid,sid,name:d.name||"",order:d.order||0}};
    if(admin||mFull().includes(sid)){
      add("cls:"+sid,()=>FB.watchCol("services/"+sid+"/classes",(list,m)=>{
        setPend("cls:"+sid,m);const seen={};
        list.forEach(d=>{seen[d.id]=1;upsert(d.id,d)});
        Object.values(S.cls).filter(c=>c.sid===sid&&!seen[c.id]).forEach(c=>dropClass(c.id));
        S.err="";reconcile();paint();
      },dbErr));
    }else{
      for(const key of mCls()){
        if(!key.startsWith(sid+"_"))continue;
        const cid=key.slice(sid.length+1);
        add("cl:"+key,()=>FB.watchDoc(cpath(sid,cid),(d,m)=>{setPend("cl:"+key,m);if(d)upsert(cid,d);else dropClass(cid);S.err="";reconcile();paint()},dbErr));
      }
    }
  }
  for(const c of Object.values(S.cls)){
    if(!(admin||mSvcs().includes(c.sid)))continue;
    const sid=c.sid,cid=c.id;
    add("srv:"+cid,()=>FB.watchCol(cpath(sid,cid)+"/servants",(list,m)=>{
      setPend("srv:"+cid,m);
      for(const k in S.srv)if(S.srv[k].cid===cid)delete S.srv[k];
      list.forEach(d=>S.srv[d.id]={id:d.id,sid,cid,name:d.name||"",order:d.order||0});paint();
    },dbErr));
    if(can("rec")||can("rep"))add("wk:"+cid,()=>FB.watchCol(cpath(sid,cid)+"/weeks",(list,m)=>{
      setPend("wk:"+cid,m);
      for(const k in S.weeks)if(S.weeks[k].cid===cid)delete S.weeks[k];
      list.forEach(d=>S.weeks[cid+"|"+d.id]={sid,cid,date:d.id,cells:d.cells||{},why:d.why||{},notes:d.notes||{}});paint();
    },dbErr));
  }
  for(const k of Object.keys(subs)){
    if(want.has(k))continue;
    subs[k]();delete subs[k];delete S.pend[k];
    const p=k.split(":");
    if(p[0]==="srv")for(const x in S.srv)if(S.srv[x].cid===p[1])delete S.srv[x];
    if(p[0]==="wk")for(const x in S.weeks)if(S.weeks[x].cid===p[1])delete S.weeks[x];
    if(p[0]==="svc")dropService(p[1]);
  }
}
function startSession(){
  unsubAll();S.me=undefined;S.svc={};S.cls={};S.srv={};S.weeks={};S.users={};S.err="";S.pend={};
  subs.me=FB.watchDoc("users/"+S.user.email,(d,m)=>{
    setPend("me",m);const first=S.me===undefined;S.me=d;
    if(!d&&isOwner()&&first&&!S.bootstrapped){
      S.bootstrapped=true;

const SCR_ALIAS={"المتابعة":"rec","متابعة":"rec","rec":"rec","التقارير":"rep","تقارير":"rep","rep":"rep","الخدمات والخدام":"srv","الخدمات":"srv","الخدام":"srv","srv":"srv"};
const IMP_HEAD=["Gmail","الاسم","مدير؟ (نعم/لا)","الشاشات","الخدمات والفصول"];
function csvLine(l){const o=[];let c="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];
  if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){o.push(c);c=""}else c+=ch}
  o.push(c);return o}
function parseTable(text){
  return String(text||"").replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim()).map(l=>(l.includes("\t")?l.split("\t"):csvLine(l)).map(x=>x.trim()));
}
const splitList=v=>String(v||"").split(/[,،;؛|\n]+/).map(x=>x.trim()).filter(Boolean);
function analyzeImport(text){
  let rows=parseTable(text);
  if(rows.length&&!String(rows[0][0]||"").includes("@"))rows=rows.slice(1);
  const byName={};svcList().forEach(x=>byName[x.name.trim()]=x);
  const seen=new Set();
  return rows.map((r,i)=>{
    const o={n:i+1,email:String(r[0]||"").trim().toLowerCase(),name:r[1]||"",role:/^(نعم|yes|y|1|true|مدير|admin)$/i.test(r[2]||"")?"admin":"user",screens:{},full:[],classes:[],services:[],items:[],status:"new",msg:""};
    const errs=[];
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email))errs.push("بريد غير صحيح");
    else if(o.email===ADMIN)errs.push("حساب المدير لا يُعدَّل من هنا");
    else if(seen.has(o.email))errs.push("بريد مكرر في الملف");
    seen.add(o.email);
    const sc=splitList(r[3]);
    if(!sc.length)o.screens={rec:true};
    else if(sc.some(x=>/^(الكل|all)$/i.test(x)))o.screens={rec:true,rep:true,srv:true};
    else sc.forEach(x=>{const k=SCR_ALIAS[x];if(k)o.screens[k]=true;else errs.push("شاشة غير معروفة: "+x)});
    for(const x of splitList(r[4])){
      if(/^(الكل|all)$/i.test(x)){o.full=Object.keys(S.svc);o.items.push("الكل");continue}
      const parts=x.split("/").map(y=>y.trim());
      const sv=byName[parts[0]];
      if(!sv){errs.push("خدمة غير موجودة: "+parts[0]);continue}
      if(parts.length===1){o.full.push(sv.id);o.items.push(sv.name+" (كل الفصول)");continue}
      const cl=classesOf(sv.id).find(c=>c.name.trim()===parts[1]);
      if(!cl){errs.push("فصل غير موجود: "+x);continue}
      o.classes.push(ckey(sv.id,cl.id));o.items.push(sv.name+" / "+cl.name);
    }
    o.services=[...new Set([...o.full,...o.classes.map(k=>{const c=Object.values(S.cls).find(c=>ckey(c.sid,c.id)===k);return c&&c.sid})])].filter(Boolean);
    if(errs.length){o.status="err";o.msg=errs.join("، ")}
    else if(S.users[o.email])o.status="upd";
    return o;
  });
}

function whyNulls(cl,d,vals){const w=getWeek(cl.id,d),o={};for(const k in vals)if(w.why&&w.why[k]!=null&&vals[k]!==3)o[k]=null;return o}

  if(val===3&&why)data.why={[k]:why};
  else{const n=whyNulls(cl,d,{[k]:val});if(Object.keys(n).length)data.why=n}
  FB.set(wpath(cl.sid,cl.id,d),data,true).catch(failMsg)}
function writeCells(cl,d,obj){const o={};for(const k in obj)o[k]=obj[k]||null;const data={cells:o},n=whyNulls(cl,d,obj);if(Object.keys(n).length)data.why=n;FB.set(wpath(cl.sid,cl.id,d),data,true).catch(failMsg)}
function readUserForm(idx){
  const q=f=>$app.querySelector(`[data-uf="${idx}"][data-f="${f}"]`);
  const all=f=>[...$app.querySelectorAll(`[data-uf="${idx}"][data-f="${f}"]`)];
  const screens={};SCREENS.forEach(([k])=>{const e=all("scr").find(x=>x.dataset.k===k);screens[k]=!!(e&&e.checked)});
  const full=all("full").filter(x=>x.checked).map(x=>x.dataset.k);
  const cc=all("cls").filter(x=>x.checked);
  const classes=cc.map(x=>x.dataset.k);
  const services=[...new Set([...full,...cc.map(x=>x.dataset.sid)])];
  const eml=q("email");
  return{editor:!!(q("editor")&&q("editor").checked),email:eml?eml.value.trim().toLowerCase():"",name:q("name").value.trim(),role:q("admin").checked?"admin":"user",active:q("active").checked,screens,full,classes,services};
}
$app.addEventListener("click",async e=>{
  const b=e.target.closest("[data-a]");if(!b||b.tagName==="INPUT"||b.tagName==="SELECT")return;
  const a=b.dataset.a,id=b.dataset.id,v=cur(),cl=curCls();
  if(a==="login"){ui.busy=true;render();try{await FB.signIn()}catch(x){ui.busy=false;if(!(x&&(x.code==="auth/popup-closed-by-user"||x.code==="auth/cancelled-popup-request")))flash("تعذر تسجيل الدخول: "+((x&&x.code)||"خطأ"));render();return}ui.busy=false;render();return}
  if(a==="logout"){
    if(Object.values(S.pend).some(Boolean)){flash("توجد تعديلات لم تُرفع بعد. اتصل بالإنترنت وانتظر ثم أعد المحاولة");return}
    try{await FB.signOutAndClear()}catch(x){}location.reload();return}
  if(a==="tab"){ui.tab=b.dataset.t;ui.del=null}
  else if(a==="d"){ui.date=+b.dataset.n?addDays(ui.date,+b.dataset.n):fridayOnOrBefore(today)}
  else if(a==="c"){if(!cl)return;const s=b.dataset.s,i=+b.dataset.i,cv=getState(cl.id,ui.date,s,i);
    if(canEditRec()){
      const nx=(cv+1)%4;
      if(nx===3&&isExcuse(i,3)){ui.pick={s,i,step:"why",txt:(getWeek(cl.id,ui.date).why||{})[cellKey(s,i)]||""};ui.bulk=null;ui.note=null}
      else{writeCell(cl,ui.date,s,i,nx);return}
    }else{
      if(cv!==0){const r=(getWeek(cl.id,ui.date).why||{})[cellKey(s,i)];flash("هذه الخانة مسجَّلة ولا يمكن تعديلها"+(r?". سبب العذر: "+r:"")+". اطلب ذلك ممن لديه صلاحية التعديل");return}
      ui.pick={s,i,step:"pick",txt:""};ui.bulk=null;ui.note=null}}
  else if(a==="pk"){if(cl&&ui.pick){const st=+b.dataset.v;if(isExcuse(ui.pick.i,st)){ui.pick.step="why"}else{writeCell(cl,ui.date,ui.pick.s,ui.pick.i,st);ui.pick=null}}}
  else if(a==="pkw"){if(!cl||!ui.pick)return;const txt=(($app.querySelector("#why")||{}).value||"").trim();if(!txt){flash("اكتب سبب العذر أولاً");return}writeCell(cl,ui.date,ui.pick.s,ui.pick.i,3,txt);ui.pick=null}
  else if(a==="pkx"){ui.pick=null;ui.bulk=null}
  else if(a==="nt"){if(!cl)return;const s=b.dataset.s,ex=(getWeek(cl.id,ui.date).notes||{})[s]||"";ui.note={s,txt:ex,ro:!!ex&&!canEditRec()};ui.pick=null;ui.bulk=null}
  else if(a==="nts"){if(!cl||!ui.note)return;const txt=(($app.querySelector("#nt")||{}).value||"").trim();if(!txt&&!canEditRec()){flash("اكتب الملاحظة أولاً");return}FB.set(wpath(cl.sid,cl.id,ui.date),{notes:{[ui.note.s]:txt||null}},true).catch(failMsg);ui.note=null}
  else if(a==="ntx"){ui.note=null}
  else if(a==="bk"){if(cl&&ui.bulk){const o={};ui.bulk.keys.forEach(k=>o[k]=1);writeCells(cl,ui.date,o)}ui.bulk=null}
  else if(a==="col"){if(!cl)return;const i=+b.dataset.i,sv=servants(cl.id);
    if(canEditRec()){const all=sv.every(s=>getState(cl.id,ui.date,s.id,i)===1),o={};sv.forEach(s=>o[cellKey(s.id,i)]=all?0:1);writeCells(cl,ui.date,o);return}
    const keys=sv.filter(s=>getState(cl.id,ui.date,s.id,i)===0).map(s=>cellKey(s.id,i));
    if(!keys.length){flash("كل خانات هذا البند مسجَّلة");return}
    ui.bulk={keys,label:ITEMS[i].sym[1]+" في بند «"+ITEMS[i].n+"»"};ui.pick=null}
  else if(a==="row"){if(!cl)return;const s=b.dataset.s;
    if(canEditRec()){const all=ITEMS.every((_,i)=>getState(cl.id,ui.date,s,i)===1),o={};ITEMS.forEach((_,i)=>o[cellKey(s,i)]=all?0:1);writeCells(cl,ui.date,o);return}
    const keys=ITEMS.map((_,i)=>i).filter(i=>getState(cl.id,ui.date,s,i)===0).map(i=>cellKey(s,i));
    if(!keys.length){flash("كل خانات هذا الخادم مسجَّلة");return}
    ui.bulk={keys,label:"✔ (وتليفون للإفتقاد) لـ "+((S.srv[s]||{}).name||"")};ui.pick=null}
  else if(a==="xl"){try{const r=await buildReport(v,cl);await saveFile(r.blob,r.name)}catch(x){flash("تعذر إنشاء الملف: "+((x&&x.message)||"خطأ"))}return}
  else if(a==="sel"){ui.sid=id;store("servants_fb_sid",id)}
  else if(a==="csel"){ui.cid=id;store("servants_fb_cid",id)}
  else if(a==="as"){const n=$app.querySelector("#ns").value.trim();if(!n)return;const sid=uid();ui.sid=sid;store("servants_fb_sid",sid);FB.set("services/"+sid,{name:n,order:Date.now()}).catch(failMsg);S.svc[sid]={id:sid,name:n,order:Date.now()}}
  else if(a==="ac"){const n=$app.querySelector("#nc").value.trim();if(!n||!v)return;const cid=uid();ui.cid=cid;store("servants_fb_cid",cid);FB.set(cpath(v.id,cid),{name:n,order:Date.now()}).catch(failMsg);S.cls[cid]={id:cid,sid:v.id,name:n,order:Date.now()}}
  else if(a==="av"){if(!cl)return;const l=$app.querySelector("#nv").value.split("\n").map(x=>x.trim()).filter(Boolean);if(!l.length)return;l.forEach((n,i)=>FB.set(spath(cl.sid,cl.id,uid()),{name:n,order:Date.now()+i,cid:cl.id}).catch(failMsg));$app.querySelector("#nv").value=""}
  else if(a==="sd"||a==="cd"||a==="vd"||a==="ud"){ui.del=a[0]+id}
  else if(a==="dc"){ui.del=null}
  else if(a==="sx"){ui.del=null;
    const paths=[];
    Object.values(S.cls).filter(c=>c.sid===id).forEach(c=>{
      servants(c.id).forEach(s=>paths.push(spath(id,c.id,s.id)));
      Object.values(S.weeks).filter(w=>w.cid===c.id).forEach(w=>paths.push(wpath(id,c.id,w.date)));
      paths.push(cpath(id,c.id))});
    paths.push("services/"+id);
    FB.delMany(paths).catch(failMsg)}
  else if(a==="cx"){ui.del=null;const c=S.cls[id];if(c){
    const paths=[...servants(id).map(s=>spath(c.sid,id,s.id)),...Object.values(S.weeks).filter(w=>w.cid===id).map(w=>wpath(c.sid,id,w.date)),cpath(c.sid,id)];
    FB.delMany(paths).catch(failMsg)}}
  else if(a==="vx"){ui.del=null;if(cl)FB.del(spath(cl.sid,cl.id,id)).catch(failMsg)}
  else if(a==="ux"){ui.del=null;if(id&&id!==ADMIN)FB.del("users/"+id).catch(failMsg);ui.uedit=null;ui.ef=null;flash("تم حذف المستخدم");return}
  else if(a==="unew"){ui.uedit="new";ui.ef=null}
  else if(a==="uedit"){ui.uedit=b.dataset.email;ui.ef=null}
  else if(a==="uback"){ui.uedit=null;ui.usub="list";ui.ef=null}
  else if(a==="uimp"){ui.usub="import"}
  else if(a==="ssub"){ui.srvSub=b.dataset.v}
  else if(a==="uadd"||a==="usave"){
    const f=readUserForm("f");
    const email=a==="uadd"?f.email:ui.uedit;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email||"")){flash("اكتب بريداً إلكترونياً صحيحاً");return}
    if(email===ADMIN){f.role="admin";f.active=true}
    FB.set("users/"+email,{editor:!!f.editor,email,name:f.name,role:f.role,active:f.active,screens:f.screens,services:f.services,full:f.full,classes:f.classes}).catch(failMsg);
    const wasNew=a==="uadd";ui.uedit=null;ui.ef=null;flash(wasNew?"تمت إضافة المستخدم":"تم الحفظ");return;
  }
  else if(a==="impprev"){ui.impText=($app.querySelector("#imptxt")||{}).value||ui.impText;ui.imp=analyzeImport(ui.impText)}
  else if(a==="imptpl"){try{await impTemplate()}catch(x){flash("تعذر إنشاء القالب: "+((x&&x.message)||"خطأ"))}return}
  else if(a==="impgo"){
    const good=(ui.imp||[]).filter(r=>r.status!=="err");
    good.forEach(o=>{const old=S.users[o.email];FB.set("users/"+o.email,{editor:old?old.editor===true:false,email:o.email,name:o.name,role:o.role,active:old?old.active!==false:true,screens:o.screens,services:o.services,full:o.full,classes:o.classes}).catch(failMsg)});
    ui.imp=null;ui.impText="";flash("تم استيراد "+good.length+" مستخدم");return}
  else if(a==="inst"){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(x){}deferredInstall=null}}
  render();
});
$app.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.a;
  if(t.id==="impfile"){readImpFile(t.files&&t.files[0]);return}
  if(t.id==="imptxt"){ui.impText=t.value;return}
  if(t.dataset.uf)return;
  if(t.id==="sv"){ui.sid=t.value;store("servants_fb_sid",t.value);ui.cid=null}
  else if(t.id==="cl"){ui.cid=t.value;store("servants_fb_cid",t.value)}
  else if(t.id==="dt"){if(t.value)ui.date=t.value}
  else if(t.id==="per"){ui.per=t.value}else if(t.id==="scope"){ui.scope=t.value}
  else if(t.id==="mo"){if(t.value)ui.month=t.value}else if(t.id==="yr"){if(t.value)ui.year=String(t.value)}
  else if(a==="sn"){const val=t.value.trim();if(val)FB.set("services/"+t.dataset.id,{name:val},true).catch(failMsg)}
  else if(a==="cn"){const val=t.value.trim(),c=S.cls[t.dataset.id];if(val&&c)FB.set(cpath(c.sid,c.id),{name:val},true).catch(failMsg)}
  else if(a==="vn"){const val=t.value.trim(),c=curCls();if(val&&c)FB.set(spath(c.sid,c.id,t.dataset.id),{name:val},true).catch(failMsg)}
  else return;
  render();
});
$app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="imptxt")ui.impText=t.value;
  else if(t.id==="why"){if(ui.pick)ui.pick.txt=t.value}
  else if(t.id==="nt"){if(ui.note)ui.note.txt=t.value}
  else if(t.id==="sq"||t.id==="uq"){
    ui[t.id==="sq"?"sq":"q"]=t.value;const q=t.value.trim().toLowerCase();
    $app.querySelectorAll("[data-nm]").forEach(r=>{r.hidden=!!q&&!r.dataset.nm.toLowerCase().includes(q)});
  }
});
$app.addEventListener("toggle",e=>{const sid=e.target&&e.target.dataset&&e.target.dataset.sid;if(sid)ui.openS[sid]=e.target.open},true);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;paint()});
window.addEventListener("appinstalled",()=>{deferredInstall=null;paint()});
window.addEventListener("online",()=>{S.online=true;paint()});
window.addEventListener("offline",()=>{S.online=false;paint()});

/* ============================ boot ============================ */
render();
if(configured){
  try{
    FB.init(CFG);
    FB.onAuth(u=>{
      S.authReady=true;S.user=u;S.bootstrapped=false;
      if(u&&u.verified===false){S.user=null;flash("بريد Google غير موثّق")}
      if(S.user)startSession();else{unsubAll();S.me=undefined;S.svc={};S.cls={};S.srv={};S.weeks={};S.users={}}
      render();
    });
  }catch(e){S.authReady=true;S.err="تعذر تهيئة Firebase: "+((e&&e.message)||"");render()}
}
if("serviceWorker"in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
