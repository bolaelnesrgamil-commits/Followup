<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>متابعة الخدام</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c5b63" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10171c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="متابعة الخدام">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600&display=swap">
<style>
/* Layout: one working column. Header (title, service picker, status chip), tabs limited to what the user may open. */
:root{
  color-scheme:light;
  --bg:#f3f5f6;--card:#ffffff;--fg:#17222b;--mut:#5d6b76;--line:#d5dce1;--head:#e9eef1;
  --accent:#1c5b63;--on-accent:#ffffff;
  --ok-bg:#cfeadb;--ok-fg:#0d5230;--no-bg:#f6d3d6;--no-fg:#8a1b2b;--ex-bg:#f7e5b4;--ex-fg:#6d5100;--tel-bg:#d6e6f7;--tel-fg:#164a7a;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;--font-display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10171c;--card:#182229;--fg:#e6edf1;--mut:#9aabb6;--line:#2c3a44;--head:#1f2c34;
  --accent:#6fbcc4;--on-accent:#0a1418;
  --ok-bg:#1d4a33;--ok-fg:#b9efd2;--no-bg:#56252d;--no-fg:#ffc9d0;--ex-bg:#554415;--ex-fg:#ffe7a3;--tel-bg:#1e3a55;--tel-fg:#bcdcf7}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.narrow{max-width:520px}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hd h1{font:600 24px/1.2 var(--font-display);margin:0;color:var(--accent)}
.hd select{flex:1;min-width:140px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:1 0 auto;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 11px;min-height:42px}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;accent-color:var(--accent)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on,button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600}
button.dng{color:var(--no-fg);border-color:var(--no-fg)}
button:disabled{opacity:.5;cursor:not-allowed}
.chip{min-height:34px;padding:4px 12px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:default}
.chip.ok{background:var(--ok-bg);color:var(--ok-fg);border-color:transparent}
.chip.warn{background:var(--ex-bg);color:var(--ex-fg);border-color:transparent}.chip.err{background:var(--no-bg);color:var(--no-fg);border-color:transparent}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.sc{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{border:1px solid var(--line);padding:5px 6px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
th{background:var(--head);font-size:13px;font-weight:600}
th[data-a]{cursor:pointer}
td.nm,th.nm{text-align:right;position:sticky;right:0;background:var(--card);min-width:110px;font-weight:600}
th.nm{background:var(--head)}
td.nm[data-a]{cursor:pointer}
td.c{padding:2px}
td.c button{width:100%;min-width:56px;min-height:42px;padding:6px 2px;font-weight:700;border-radius:6px;border-color:transparent;background:transparent;font-size:13px}
td.c button.ok{background:var(--ok-bg);color:var(--ok-fg)}
td.c button.no{background:var(--no-bg);color:var(--no-fg)}
td.c button.ex{background:var(--ex-bg);color:var(--ex-fg)}
td.c button.tel{background:var(--tel-bg);color:var(--tel-fg)}
td.r-g{background:var(--ok-bg);color:var(--ok-fg)}td.r-m{background:var(--ex-bg);color:var(--ex-fg)}td.r-b{background:var(--no-bg);color:var(--no-fg)}
tfoot td{background:var(--head);font-weight:700}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
textarea{width:100%;min-height:90px}
h2{font-size:16px;margin:0}
h3{font-size:14px;margin:4px 0 0;color:var(--mut);font-weight:600}
.msg{background:var(--accent);color:var(--on-accent);padding:8px 12px;border-radius:8px;text-align:center}
.warn{background:var(--ex-bg);color:var(--ex-fg);padding:8px 12px;border-radius:8px}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px}
.ucard{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--head);color:var(--mut)}
code.ltr{direction:ltr;unicode-bidi:isolate;display:block;padding:8px 10px;background:var(--head);border-radius:8px;overflow-wrap:anywhere;font-size:13px;text-align:left}
.big{font-size:17px;min-height:52px}
</style>
</head>
<body>
<div id="app"></div>
<noscript>يحتاج هذا التطبيق إلى تفعيل JavaScript.</noscript>
<script src="firebase-config.js"></script>
<script src="exceljs.min.js"></script>
<script src="firebase-bundle.js"></script>
<script>
"use strict";
/* ============================ constants ============================ */
/* حالات كل بند: 0 فارغ، 1، 2، 3. w = وزن الحالة في النسبة (null = عذر لا يُحسب) */
const ITEMS=[
  {n:"حضور القداس",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"إفتقاد",sym:["","تليفون","زيارة","X"],w:[0,.5,1,0]},
  {n:"تحضير",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"حضور الخدمة",sym:["","✔","✘","عذر"],w:[0,1,0,null]},
  {n:"حضور إجتماع الخدام",sym:["","✔","✘","عذر"],w:[0,1,0,null]}
];
const NI=ITEMS.length;
const stCls=(i,s)=>!s?"":i===1?["","tel","ok","no"][s]:["","ok","no","ex"][s];
const SCREENS=[["rec","المتابعة"],["rep","التقارير"],["srv","الخدمات والخدام"]];
const $app=document.getElementById("app");
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date());
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

const CFG=window.FIREBASE_CONFIG||{};
const ADMIN=String(window.APP_ADMIN_EMAIL||"").trim().toLowerCase();
const placeholder=v=>!v||/PASTE/i.test(String(v));
const configured=!placeholder(CFG.apiKey)&&!placeholder(CFG.projectId)&&!placeholder(CFG.appId)&&!placeholder(ADMIN)&&!!window.FB;

/* ============================ state ============================ */
const S={user:null,authReady:false,me:undefined,svc:{},srv:{},weeks:{},users:{},err:"",pend:{},online:navigator.onLine};
const ui={tab:"",sid:null,date:today,per:"month",month:today.slice(0,7),year:today.slice(0,4),scope:"one",del:null,msg:"",busy:false};
try{ui.sid=localStorage.getItem("servants_fb_sid")}catch(e){}
const subs={};
let deferredInstall=null,lastTab="",msgTimer=0,raf=0;

const isOwner=()=>!!S.user&&!!ADMIN&&S.user.email===ADMIN;
const isAdmin=()=>!!S.user&&(isOwner()||!!(S.me&&S.me.active!==false&&S.me.role==="admin"));
const isActive=()=>isOwner()||!!(S.me&&S.me.active!==false);
const can=sc=>isAdmin()||!!(isActive()&&S.me&&S.me.screens&&S.me.screens[sc]);
const mySvcIds=()=>isAdmin()?Object.keys(S.svc):((S.me&&S.me.services)||[]).filter(id=>S.svc[id]);
const svcList=()=>mySvcIds().map(id=>S.svc[id]).sort((a,b)=>(a.order||0)-(b.order||0));
const cur=()=>{const l=svcList();return l.find(x=>x.id===ui.sid)||l[0]||null};
const servants=sid=>Object.values(S.srv).filter(x=>x.sid===sid).sort((a,b)=>(a.order||0)-(b.order||0));
const tabsAllowed=()=>{const t=[];if(can("rec"))t.push(["rec","المتابعة"]);if(can("rep"))t.push(["rep","التقارير"]);if(can("srv"))t.push(["srv","الخدمات والخدام"]);if(isAdmin())t.push(["usr","المستخدمون"]);t.push(["acc","حسابي"]);return t};
const cellKey=(vid,i)=>vid+"_"+i;
const getState=(sid,date,vid,i)=>{const w=S.weeks[sid+"|"+date];return(w&&w.cells&&w.cells[cellKey(vid,i)])||0};

/* ============================ statistics ============================ */
function stats(sid,test){
  const sv=servants(sid),by={};
  sv.forEach(s=>by[s.id]={sv:s,cnt:ITEMS.map(()=>[0,0,0,0]),score:0,rec:0,ex:0,p:null});
  for(const k in S.weeks){
    const w=S.weeks[k];if(w.sid!==sid||!test(w.date))continue;
    for(const ck in (w.cells||{})){
      const u=ck.lastIndexOf("_"),vid=ck.slice(0,u),i=+ck.slice(u+1),st=+w.cells[ck],o=by[vid];
      if(!o||!ITEMS[i]||!st)continue;
      o.cnt[i][st]++;
      const wt=ITEMS[i].w[st];
      if(wt===null)o.ex++;else{o.rec++;o.score+=wt}
    }
  }
  return sv.map(s=>{const o=by[s.id];o.p=o.rec>0?o.score/o.rec:null;return o});
}
const rate=p=>p==null?"":p>=.9?"ممتاز":p>=.75?"جيد جداً":p>=.5?"جيد":"يحتاج إلى متابعة";
const rcls=p=>p==null?"":p>=.75?"g":p>=.5?"m":"b";
const pc=p=>p==null?"":Math.round(p*100)+"%";
const avg=a=>{const x=a.filter(v=>v!=null);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null};
const testFn=()=>ui.per==="month"?d=>d.startsWith(ui.month):ui.per==="year"?d=>d.startsWith(ui.year):()=>true;
const periodLabel=()=>ui.per==="month"?ui.month:ui.per==="year"?ui.year:"الكل";
function rowOf(o){const c=o.cnt;return[o.sv.name,c[0][1],c[1][1],c[1][2],c[2][1],c[3][1],c[4][1],o.rec,o.ex,o.p,rate(o.p)]}
const REPORT_HEAD=["الخادم","حضور القداس","إفتقاد (تليفون)","إفتقاد (زيارة)","تحضير","حضور الخدمة","حضور إجتماع الخدام","البنود المسجّلة","أيام العذر","النسبة","التقدير"];
function totalRow(st){
  const sum=f=>st.reduce((s,o)=>s+f(o),0),p=avg(st.map(o=>o.p));
  return["المتوسط",sum(o=>o.cnt[0][1]),sum(o=>o.cnt[1][1]),sum(o=>o.cnt[1][2]),sum(o=>o.cnt[2][1]),sum(o=>o.cnt[3][1]),sum(o=>o.cnt[4][1]),sum(o=>o.rec),sum(o=>o.ex),p,rate(p)];
}

/* ============================ data subscriptions ============================ */
const dbErr=e=>{S.err=(e&&e.code==="permission-denied")?"رفضت قاعدة البيانات الطلب. تأكد من نشر قواعد Firestore ومن تسجيل بريدك لدى المدير.":"تعذر الاتصال بقاعدة البيانات"+(e&&e.code?" ("+e.code+")":"");paint()};
const setPend=(k,m)=>{S.pend[k]=!!(m&&m.pending)};
function unsubAll(){for(const k in subs){try{subs[k]()}catch(e){}delete subs[k]}}
function reconcile(){
  if(!S.user||!isActive())return;
  const want=new Set(["me"]);
  const add=(k,fn)=>{want.add(k);if(!subs[k])subs[k]=fn()};
  if(isAdmin()){
    add("svcs",()=>FB.watchCol("services",(list,m)=>{
      setPend("svcs",m);const seen={};
      list.forEach(d=>{seen[d.id]=1;S.svc[d.id]={id:d.id,name:d.name||"",order:d.order||0}});
      Object.keys(S.svc).forEach(id=>{if(!seen[id])dropService(id)});
      S.err="";reconcile();paint();
    },dbErr));
    add("users",()=>FB.watchCol("users",(list,m)=>{setPend("users",m);S.users={};list.forEach(d=>S.users[d.id]=d);paint()},dbErr));
  }
  for(const sid of (isAdmin()?Object.keys(S.svc):((S.me&&S.me.services)||[]))){
    if(!isAdmin())add("svc:"+sid,()=>FB.watchDoc("services/"+sid,(d,m)=>{setPend("svc:"+sid,m);if(d)S.svc[sid]={id:sid,name:d.name||"",order:d.order||0};else dropService(sid);S.err="";paint()},dbErr));
    add("srv:"+sid,()=>FB.watchCol("services/"+sid+"/servants",(list,m)=>{
      setPend("srv:"+sid,m);
      for(const k in S.srv)if(S.srv[k].sid===sid)delete S.srv[k];
      list.forEach(d=>S.srv[d.id]={id:d.id,sid,name:d.name||"",order:d.order||0});paint();
    },dbErr));
    if(can("rec")||can("rep"))add("wk:"+sid,()=>FB.watchCol("services/"+sid+"/weeks",(list,m)=>{
      setPend("wk:"+sid,m);
      for(const k in S.weeks)if(S.weeks[k].sid===sid)delete S.weeks[k];
      list.forEach(d=>S.weeks[sid+"|"+d.id]={sid,date:d.id,cells:d.cells||{}});paint();
    },dbErr));
  }
  for(const k of Object.keys(subs))if(!want.has(k)){subs[k]();delete subs[k];delete S.pend[k];const p=k.split(":");if(p[0]==="srv")for(const x in S.srv)if(S.srv[x].sid===p[1])delete S.srv[x];if(p[0]==="wk")for(const x in S.weeks)if(S.weeks[x].sid===p[1])delete S.weeks[x];if(p[0]==="svc")delete S.svc[p[1]]}
}
function dropService(id){
  delete S.svc[id];
  for(const k in S.srv)if(S.srv[k].sid===id)delete S.srv[k];
  for(const k in S.weeks)if(S.weeks[k].sid===id)delete S.weeks[k];
}
function startSession(){
  unsubAll();S.me=undefined;S.svc={};S.srv={};S.weeks={};S.users={};S.err="";S.pend={};
  subs.me=FB.watchDoc("users/"+S.user.email,(d,m)=>{
    setPend("me",m);const first=S.me===undefined;S.me=d;
    if(!d&&isOwner()&&first&&!S.bootstrapped){
      S.bootstrapped=true;
      FB.set("users/"+S.user.email,{email:S.user.email,name:S.user.name||"المدير",role:"admin",active:true,screens:{rec:true,rep:true,srv:true},services:[]}).catch(dbErr);
    }
    S.err="";reconcile();paint();
  },dbErr);
}
function paint(){clearTimeout(raf);raf=setTimeout(softRender,30)}

/* ============================ views ============================ */
function flash(m){ui.msg=m;render();clearTimeout(msgTimer);msgTimer=setTimeout(()=>{ui.msg="";render()},3500)}
const failMsg=e=>flash("تعذر الحفظ: "+((e&&e.code)==="permission-denied"?"لا تملك صلاحية هذا الإجراء":(e&&e.code)||"خطأ"));
function chipInfo(){
  if(!S.online)return{t:"بدون اتصال",c:"warn"};
  if(S.err)return{t:"تعذر الاتصال",c:"err"};
  if(Object.values(S.pend).some(Boolean))return{t:"بانتظار المزامنة",c:"warn"};
  return{t:"متصل",c:"ok"};
}
function simple(inner,narrow){return `<div class="wrap${narrow?" narrow":""}"><div class="hd"><h1>متابعة الخدام</h1></div>${inner}</div>`}
function setupView(){
  return simple(`<div class="card"><h2>الإعداد غير مكتمل</h2>
  <div class="mut">لم تُدخل بعد إعدادات Firebase. افتح الملف <b>firebase-config.js</b> في مستودع GitHub، واستبدل كل القيم المكتوب بها <b>PASTE</b> بقيمك، ثم احفظ (Commit) وأعد فتح التطبيق مرتين. خطوات الحصول على القيم في ملف الدليل.</div>
  ${!window.FB?'<div class="warn">ملف firebase-bundle.js غير محمّل. تأكد من رفعه مع باقي الملفات.</div>':""}</div>`,true);
}
function loginView(){
  return simple(`<div class="card"><h2>تسجيل الدخول</h2>
  <div class="mut">ادخل بحساب Google المسجَّل لدى أمين الخدمة. إذا لم يكن بريدك مسجلاً فسيظهر لك ذلك بعد الدخول.</div>
  ${S.err?`<div class="warn">${esc(S.err)}</div>`:""}
  ${ui.msg?`<div class="msg" role="status">${esc(ui.msg)}</div>`:""}
  <button class="pri big" data-a="login"${ui.busy?" disabled":""}>${ui.busy?"جارٍ الدخول...":"تسجيل الدخول بحساب Google"}</button></div>${installCard()}`,true);
}
function blockedView(kind){
  const t=kind==="off"?"تم إيقاف حسابك":"بريدك غير مسجَّل بعد";
  const d=kind==="off"?"أوقف أمين الخدمة هذا الحساب. تواصل معه إذا كان ذلك بالخطأ.":"سجّلت الدخول، لكن هذا البريد غير مضاف إلى المستخدمين. أرسل البريد التالي لأمين الخدمة ليضيفه، ثم أعد فتح التطبيق.";
  return simple(`<div class="card"><h2>${t}</h2><div class="mut">${d}</div><code class="ltr">${esc(S.user.email)}</code><div><button data-a="logout">تسجيل الخروج</button></div></div>`,true);
}
function installCard(){
  if(isStandalone())return "";
  if(deferredInstall)return `<div class="card"><h2>تثبيت التطبيق</h2><div class="mut">ثبّت التطبيق ليظهر بأيقونة على الشاشة الرئيسية.</div><div><button class="pri" data-a="inst">تثبيت التطبيق</button></div></div>`;
  return `<div class="card"><h2>تثبيت التطبيق</h2><div class="mut">${isIOS?"في Safari: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».":"في Chrome: افتح القائمة (⋮) ثم «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»."}</div></div>`;
}
function stateBtn(i,s,attrs,label){
  const c=stCls(i,s);return `<button class="${c}" ${attrs} aria-label="${esc(label)}">${ITEMS[i].sym[s]||"&nbsp;"}</button>`;
}
function recView(v){
  if(!v)return `<div class="card empty">لا توجد خدمة مسموح لك بها. تواصل مع أمين الخدمة.</div>`;
  const sv=servants(v.id);
  if(!sv.length)return `<div class="card empty">لا يوجد خدام في هذه الخدمة بعد.${can("srv")?" أضفهم من تبويب «الخدمات والخدام».":""}</div>`;
  const st=stats(v.id,d=>d===ui.date);
  let h=`<div class="card"><div class="bar"><button data-a="d" data-n="-7">الأسبوع السابق</button><input type="date" id="dt" value="${ui.date}" aria-label="تاريخ الأسبوع"><button data-a="d" data-n="7">الأسبوع التالي</button><button data-a="d" data-n="0">اليوم</button></div>

const NAVY="FF1F3864",BORDER={style:"thin",color:{argb:"FF999999"}};
const FILLS={"ممتاز":"C6EFCE","جيد جداً":"C6EFCE","جيد":"FFEB9C","يحتاج إلى متابعة":"FFC7CE","✔":"C6EFCE","✘":"FFC7CE","عذر":"FFEB9C","زيارة":"C6EFCE","تليفون":"DDEBF7","X":"FFC7CE"};
function sheetName(n,used){let s=String(n).replace(/[\\\/\?\*\[\]:]/g,"").trim().slice(0,28)||"خدمة";let k=s,i=2;while(used.has(k.toLowerCase()))k=s.slice(0,25)+" "+(i++);used.add(k.toLowerCase());return k}
function addSheet(wb,used,name,aoa,widths,o={}){
  const ws=wb.addWorksheet(sheetName(name,used),{views:[{rightToLeft:true,state:"frozen",ySplit:1}]});
  aoa.forEach(r=>ws.addRow(r));
  widths.forEach((w,i)=>{ws.getColumn(i+1).width=w});
  ws.eachRow({includeEmpty:false},(row,n)=>{
    row.eachCell({includeEmpty:true},(c,ci)=>{
      const head=n===1;
      c.font={name:"Arial",size:11,bold:head||(o.lastBold&&n===aoa.length),color:head?{argb:"FFFFFFFF"}:undefined};
      c.alignment={horizontal:ci===1&&!head?"right":"center",vertical:"middle",wrapText:true};
      c.border={top:BORDER,left:BORDER,bottom:BORDER,right:BORDER};
      if(head)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:NAVY}};
      else if(typeof c.value==="string"&&FILLS[c.value]&&(ci>=(o.paintFrom||99)||ci===o.rate))c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF"+FILLS[c.value]}};
      if(!head&&o.pct&&o.pct.includes(ci)&&typeof c.value==="number")c.numFmt="0%";
    });
  });
  ws.getRow(1).height=38;
  return ws;
}
function summaryAoa(sid,t){
  const st=stats(sid,t),rows=st.map(o=>{const r=rowOf(o);r[9]=o.p==null?"":o.p;return r});
  if(rows.length){const r=totalRow(st);r[9]=r[9]==null?"":r[9];rows.push(r)}
  return[REPORT_HEAD,...rows];
}
const SUMW=[22,15,15,15,13,15,17,14,11,10,18];
function detailAoa(list,t,withSvc){
  const out=[[...(withSvc?["الخدمة"]:[]),"التاريخ","الخادم",...ITEMS.map(x=>x.n)]];
  for(const v of list){
    const nm={};servants(v.id).forEach((s,i)=>nm[s.id]={n:s.name,i});
    const recs={};
    for(const k in S.weeks){const w=S.weeks[k];if(w.sid!==v.id||!t(w.date))continue;
      for(const ck in w.cells){const u=ck.lastIndexOf("_"),vid=ck.slice(0,u),i=+ck.slice(u+1);if(!nm[vid]||!ITEMS[i]||!w.cells[ck])continue;
        const key=w.date+"|"+vid;(recs[key]=recs[key]||{d:w.date,vid,c:Array(NI).fill(0)}).c[i]=+w.cells[ck]}}
    Object.values(recs).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:nm[a.vid].i-nm[b.vid].i)
      .forEach(r=>out.push([...(withSvc?[v.name]:[]),r.d,nm[r.vid].n,...r.c.map((s,i)=>ITEMS[i].sym[s])]));
  }
  return out;
}
async function buildReport(v){
  if(!window.ExcelJS)throw new Error("مكتبة الإكسيل غير محمّلة");
  const t=testFn(),wb=new ExcelJS.Workbook(),used=new Set();wb.creator="متابعة الخدام";
  const asciiPer=ui.per==="all"?"all":periodLabel();
  let name;
  if(ui.scope==="all"){
    const l=svcList();
    const cmp=[["الخدمة","عدد الخدام","متوسط الالتزام","التقدير"],...l.map(x=>{const p=avg(stats(x.id,t).map(y=>y.p));return[x.name,servants(x.id).length,p==null?"":p,rate(p)]})];
    addSheet(wb,used,"مقارنة الخدمات",cmp,[26,13,17,18],{pct:[3],rate:4});
    l.forEach(x=>addSheet(wb,used,x.name,summaryAoa(x.id,t),SUMW,{pct:[10],rate:11,lastBold:true}));
    addSheet(wb,used,"التفاصيل",detailAoa(l,t,true),[22,13,22,...ITEMS.map(()=>17)],{paintFrom:4});
    name="servants-followup-all-services-"+asciiPer+".xlsx";
  }else{
    if(!v)throw new Error("لا توجد خدمة");
    addSheet(wb,used,"الملخص",summaryAoa(v.id,t),SUMW,{pct:[10],rate:11,lastBold:true});
    addSheet(wb,used,"التفاصيل",detailAoa([v],t,false),[13,22,...ITEMS.map(()=>17)],{paintFrom:3});
    name="servants-followup-service"+(svcList().findIndex(x=>x.id===v.id)+1)+"-"+asciiPer+".xlsx";
  }
  const buf=await wb.xlsx.writeBuffer();
  return{blob:new Blob([buf],{type:XLSX_MIME}),name};
}
async function saveFile(blob,name){
  if(isIOS&&navigator.canShare){
    try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),8000);
}

    if(email===ADMIN){f.role="admin";f.active=true}
    FB.set("users/"+email,{email,name:f.name,role:f.role,active:f.active,screens:f.screens,services:f.services}).then(()=>flash(a==="uadd"?"تمت إضافة المستخدم":"تم الحفظ")).catch(failMsg);
    if(a==="uadd")render();
    return;
  }
  else if(a==="inst"){if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch(x){}deferredInstall=null}}
  render();
});
$app.addEventListener("change",e=>{
  const t=e.target,a=t.dataset.a;
  if(t.dataset.uf)return;
  if(t.id==="sv"){ui.sid=t.value;try{localStorage.setItem("servants_fb_sid",t.value)}catch(x){}}
  else if(t.id==="dt"){if(t.value)ui.date=t.value}
  else if(t.id==="per"){ui.per=t.value}else if(t.id==="scope"){ui.scope=t.value}
  else if(t.id==="mo"){if(t.value)ui.month=t.value}else if(t.id==="yr"){if(t.value)ui.year=String(t.value)}
  else if(a==="sn"){const val=t.value.trim();if(val)FB.set("services/"+t.dataset.id,{name:val},true).catch(failMsg)}
  else if(a==="vn"){const val=t.value.trim(),v=cur();if(val&&v)FB.set("services/"+v.id+"/servants/"+t.dataset.id,{name:val},true).catch(failMsg)}
  else return;
  render();
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;paint()});
window.addEventListener("appinstalled",()=>{deferredInstall=null;paint()});
window.addEventListener("online",()=>{S.online=true;paint()});
window.addEventListener("offline",()=>{S.online=false;paint()});

/* ============================ boot ============================ */
render();
if(configured){
  try{
    FB.init(CFG);
    FB.onAuth(u=>{
      S.authReady=true;S.user=u;S.bootstrapped=false;
      if(u&&u.verified===false){S.user=null;flash("بريد Google غير موثّق")}
      if(S.user)startSession();else{unsubAll();S.me=undefined;S.svc={};S.srv={};S.weeks={};S.users={}}
      render();
    });
  }catch(e){S.authReady=true;S.err="تعذر تهيئة Firebase: "+((e&&e.message)||"");render()}
}
if("serviceWorker"in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
</script>
</body>
</html>
